plugins { id 'com.android.application' }
android { namespace 'uk.community.orion'; compileSdk 36
 defaultConfig { applicationId 'uk.community.orion'; minSdk 26; targetSdk 35; versionCode ((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()); versionName ('0.1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0') + (System.getenv('GITHUB_RUN_ATTEMPT') ? '.' + System.getenv('GITHUB_RUN_ATTEMPT') : '-local')) }
 // Optional ABI restriction for smaller device-specific test builds.
 if (providers.gradleProperty('orionArm64').orNull == 'true') {
  defaultConfig { ndk { abiFilters 'arm64-v8a' } }
 }
 // Stable signing key (CI secrets) so in-app updates install over the previous build; debug key otherwise.
 signingConfigs { orion { if (System.getenv('ORION_KEYSTORE')) { storeFile file(System.getenv('ORION_KEYSTORE')); storePassword System.getenv('ORION_KEYSTORE_PASSWORD'); keyAlias System.getenv('ORION_KEY_ALIAS'); keyPassword System.getenv('ORION_KEY_PASSWORD') } } }
 buildTypes { debug { if (System.getenv('ORION_KEYSTORE')) { signingConfig signingConfigs.orion } } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'org.mozilla.geckoview:geckoview:153.0.20260810162159' }
