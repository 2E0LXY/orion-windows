<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Page Load Error</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #f5f5f5; color: #333;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 2rem;
  }
  .container { max-width: 520px; text-align: center; }
  .logo { width: 64px; height: 64px; margin-bottom: 1.5rem; opacity: .55; }
  h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: .75rem; }
  .url { color: #666; font-size: .9rem; word-break: break-all; margin-bottom: 1.5rem; }
  .details {
    background: #fff; border-radius: 8px; padding: 1.25rem;
    text-align: left; font-size: .85rem; line-height: 1.6; color: #555;
  }
  .details p { margin-bottom: .75rem; }
  .details ul { margin-left: 1.25rem; }
  .details li { margin-bottom: .35rem; }
</style>
</head>
<body>
<div class="container">
  <img class="logo" src="{{LOGO}}" alt="">
  <h1>Page Load Error</h1>
  <p class="url">{{URL}}</p>
  <div class="details">
    <p>An error occurred while loading this page.</p>
    <ul>
      <li>Try reloading the page</li>
      <li>Check your internet connection</li>
      <li>The site may be temporarily unavailable</li>
    </ul>
    <p>{{DESCRIPTION}}</p>
  </div>
</div>
</body>
</html>
