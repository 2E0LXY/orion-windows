---
name: Setup build environment
inputs:
  app-id:
    required: true
  private-key:
    required: true
runs:
  using: composite
  steps:
  - uses: actions/create-github-app-token@v3
    id: app-token
    with:
      client-id: ${{ inputs.app-id }}
      private-key: ${{ inputs.private-key }}
      owner: kagisearch

  - name: Configure git credentials
    shell: cmd
    run: |
      git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"
      git config --global --add url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "git@github.com:"

  - name: Check that correct MSVC version is installed
    shell: bash
    run: ./ci/check_msvc.sh

  - name: Initialize submodules
    shell: cmd
    run: call ci\setup_submodules.cmd

  - name: Authenticate to Google Cloud
    uses: google-github-actions/auth@v3
    with:
      service_account: "orion-windows@prod-kagi-lab-685b.iam.gserviceaccount.com"
      workload_identity_provider: "projects/402173988874/locations/global/workloadIdentityPools/github-com/providers/kagi-search"

  - name: Set up gcloud CLI
    uses: google-github-actions/setup-gcloud@v3

  - name: Export GCS access token
    shell: bash
    run: |
      token=$(gcloud auth print-access-token)
      echo "::add-mask::$token"
      echo "GSUTIL_CMD_CURL_AUTHTOKEN=$token" >>"$GITHUB_ENV"
