name: Android prototype APK
on:
  push:
    branches: [chatgpt/geckoview-home-splash, chatgpt/android, chatgpt/drive-sync, chatgpt/android-recovery-session]
    paths:
      - 'platforms/android/**'
      - '.github/workflows/android-prototype.yml'
      - 'assets/orion-mark.svg'
  pull_request:
    branches: [chatgpt/drive-sync, chatgpt/geckoview-home-splash]
    paths: ['platforms/android/**', '.github/workflows/android-prototype.yml', 'assets/orion-mark.svg']
  workflow_dispatch:
concurrency:
  group: orion-android-test-apk-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Source-level UI and packaging regression tests
        working-directory: platforms/android
        run: python3 -m unittest discover -s tests -v
      - name: Build ARM64 debug APK
        working-directory: platforms/android
        run: gradle --no-daemon -PorionArm64=true assembleDebug
      - name: Android lint static analysis
        working-directory: platforms/android
        run: gradle --no-daemon -PorionArm64=true lintDebug
      - name: Print full Android lint findings
        if: always()
        working-directory: platforms/android
        run: |
          report=$(find app/build -type f -name lint-results-debug.txt -print -quit 2>/dev/null || true)
          if [ -n "$report" ]; then cat "$report"; else echo "No Android lint text report generated"; fi
      - name: Verify output, ABI and stage direct APK
        run: |
          set -euo pipefail
          apk="platforms/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          python3 - <<'PY_CHECK'
          import zipfile
          apk='platforms/android/app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
              abis={p.split('/')[1] for p in z.namelist() if p.startswith('lib/') and p.endswith('.so')}
          print('Native ABIs:', sorted(abis))
          assert abis=={'arm64-v8a'}, abis
          PY_CHECK
          cp "$apk" Orion-Browser-Android-test.apk
          test -s Orion-Browser-Android-test.apk
          sha256sum Orion-Browser-Android-test.apk | tee Orion-Browser-Android-test.apk.sha256
      # GitHub Actions artifacts download as ZIPs. Do not upload an Actions artifact:
      # the user-facing, direct .apk download is a GitHub Release asset instead.
      - name: Publish direct APK to versioned and latest test releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/chatgpt/geckoview-home-splash'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dev_tag="android-dev-${GITHUB_RUN_ID}"
          latest_tag="android-latest-test"
          notes="Experimental ARM64 debug APK; commit ${GITHUB_SHA}; workflow ${GITHUB_RUN_ID}. Automated checks passed. Real-device privacy, DNS and install testing remain UNVERIFIED. Debug signing may vary across runs."
          gh release create "$dev_tag" Orion-Browser-Android-test.apk Orion-Browser-Android-test.apk.sha256 \
            --target "$GITHUB_SHA" --prerelease --title "Orion Android experimental ${GITHUB_RUN_ID}" --notes "$notes"
          if ! gh release view "$latest_tag" >/dev/null 2>&1; then
            gh release create "$latest_tag" --target "$GITHUB_SHA" --prerelease \
              --title "Orion Android - latest test APK" --notes "$notes"
          fi
          gh release upload "$latest_tag" Orion-Browser-Android-test.apk Orion-Browser-Android-test.apk.sha256 --clobber
          gh release edit "$latest_tag" --notes "$notes"
          echo "Direct APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${latest_tag}/Orion-Browser-Android-test.apk"
