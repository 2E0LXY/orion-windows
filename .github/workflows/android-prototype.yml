name: Android prototype APK
on:
  push:
    branches: [chatgpt/android, chatgpt/drive-sync]
    paths: ['platforms/android/**', '.github/workflows/android-prototype.yml']
  workflow_dispatch:
concurrency:
  group: orion-android-test-apk
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: UI regression contract tests
        working-directory: platforms/android
        run: python3 -m unittest discover -s tests -v
      - name: Build debug APK
        working-directory: platforms/android
        run: gradle --no-daemon assembleDebug
      - name: Verify APK output and SHA256
        run: |
          test -s platforms/android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum platforms/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: orion-community-debug
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish experimental APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-dev-${GITHUB_RUN_ID}"
          gh release create "$tag" platforms/android/app/build/outputs/apk/debug/app-debug.apk --target "$GITHUB_SHA" --prerelease --title "Android experimental build ${GITHUB_RUN_ID}" --notes "Debug build; not security reviewed or device tested."
      - name: Publish latest APK shortcut
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-latest-test"
          apk="platforms/android/app/build/outputs/apk/debug/app-debug.apk"
          cp "$apk" Orion-Browser-Android-test.apk
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title "Orion Android — latest test APK" --notes "Debug APK, not a production release."
          fi
          gh release upload "$tag" Orion-Browser-Android-test.apk --clobber
          gh release edit "$tag" --notes "Latest successfully built debug APK. Git commit: $GITHUB_SHA; workflow run: $GITHUB_RUN_ID. Experimental; not device/security reviewed. Debug signing may require uninstall before upgrading."
